<!DOCTYPE html>
<html>
<head>
   <title>Lung Cancer Prediction</title>
   <style>
       body {
           font-family: Arial, sans-serif;
           background: #f4f6f8;
           padding: 30px;
       }

       .container {
           max-width: 700px;
           margin: auto;
           background: white;
           padding: 25px;
           border-radius: 10px;
           box-shadow: 0 0 10px rgba(0,0,0,0.08);
       }

       h1 {
           text-align: center;
           margin-bottom: 20px;
       }

       form p {
           margin-bottom: 12px;
       }

       button {
           background: #007bff;
           color: white;
           border: none;
           padding: 10px 18px;
           border-radius: 6px;
           cursor: pointer;
       }

       button:hover {
           background: #0056b3;
       }

       .result {
           margin-top: 20px;
           padding: 15px;
           background: #e9f7ef;
           border-left: 5px solid #28a745;
           font-weight: bold;
       }
   </style>
</head>
<body>
   <div class="container">
       <h1>Lung Cancer Prediction</h1>

       <form method="post">
           {% csrf_token %}
           {{ form.as_p }}
           <button type="submit">Predict</button>
       </form>

       {% if prediction %}
           <div class="result">
               Prediction Result: {{ prediction }}
           </div>
       {% endif %}
   </div>
</body>
</html>
